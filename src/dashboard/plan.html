<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bringup · plan</title>
<style>
	@font-face { font-family: "Shoulders"; src: url("/fonts/BigShouldersDisplay.woff") format("woff"); font-weight: 100 900; font-display: swap; }
	@font-face { font-family: "Instrument"; src: url("/fonts/InstrumentSans.woff") format("woff"); font-weight: 400 700; font-display: swap; }
	@font-face { font-family: "JBMono"; src: url("/fonts/JetBrainsMono.woff") format("woff"); font-weight: 100 800; font-display: swap; }
	:root { --ink: #16140f; --ink-2: #4b463c; --ink-3: #8a8478; --line: #e6e3dc; --signal: #ff4a17; --wash: rgba(255, 74, 23, .1); }
	* { box-sizing: border-box; }
	html, body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.45 "Instrument", system-ui, sans-serif; }
	header { display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
	.logo { font: 700 22px/1 "Shoulders", system-ui, sans-serif; text-decoration: none; color: inherit; }
	.logo b { color: var(--signal); }
	#status { margin-left: auto; font-size: 13px; color: var(--ink-3); }
	.said { padding: 12px 28px 4px; color: var(--ink-3); font-size: 14px; }
	.said b { color: var(--ink); font-weight: 500; }
	main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; padding: 10px 28px 30px; }
	@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
	<span id="status">Plan · nothing built yet</span>
</header>
<div class="said">You said: <b id="sentence"></b></div>
<main></main>
<script type="module">
	// The plan's drawing and side panel are plan-canvas.js and plan-panel.js, shared with the design page before a
	// build (system.html). This page is what a plan built before ids were kept still opens.
	import { mountNav } from "/nav.js"
	mountNav({ section: "home", trail: [{ label: "Home", href: "/" }, { label: "Plan: nothing built yet" }] })
	import { mountPlanCanvas } from "/plan-canvas.js"
	import { mountPlanPanel } from "/plan-panel.js"
	import { spendLabel } from "/spend.js"
	const $ = (id) => document.getElementById(id)
	const id = decodeURIComponent(location.pathname.split("/").pop())
	const main = document.querySelector("main")

	// What was said, and what planning spent: no calls means scripted; a real call without token counts reads "unknown", never free.
	function onView(v) {
		$("sentence").textContent = `“${v.plan.sentence}”`
		if (v.spend) $("status").textContent = `Plan · nothing built yet · ${v.spend.calls === 0 ? "scripted: free" : `planning ${spendLabel(v.spend, false).toLowerCase()}`}`
	}

	const r = await fetch(`/api/plans/${encodeURIComponent(id)}`)
	if (!r.ok) main.innerHTML = `<p style="padding:20px">No such plan. <a href="/">Start again</a></p>`
	else {
		const view = await r.json()
		let panel = null
		const canvas = mountPlanCanvas(main, { id, view, onView: (v) => panel?.apply(v), onMsg: (t, err) => panel?.msg(t, err) })
		panel = mountPlanPanel(main, {
			id,
			view,
			canvas,
			onView,
			onBuild: (v) => (location.href = v.systemId ? `/system?id=${encodeURIComponent(v.systemId)}` : `/?run=${encodeURIComponent(v.runId)}`),
		})
	}
</script>
</body>
</html>
