<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bringup · Board</title>
<style>
	/* Bringup's board page: the run page's drafting paper around one big instrument screen, the board. */
	@font-face { font-family: "Shoulders"; src: url("/fonts/BigShouldersDisplay.woff") format("woff"); font-weight: 100 900; font-display: swap; }
	@font-face { font-family: "Instrument"; src: url("/fonts/InstrumentSans.woff") format("woff"); font-weight: 400 700; font-stretch: 75% 100%; font-display: swap; }
	@font-face { font-family: "JBMono"; src: url("/fonts/JetBrainsMono.woff") format("woff"); font-weight: 100 800; font-display: swap; }
	:root {
		--paper: #efe9dc; --paper-2: #e6dfcf; --paper-3: #dcd3c0; --rule: #c9bea7; --rule-2: #b3a78d;
		--ink: #16140f; --ink-2: #4b463c; --ink-3: #807865;
		--signal: #ff4a17; --signal-ink: #c2330a; --signal-wash: rgba(255, 74, 23, .12);
		--ok: #11804a; --ok-wash: rgba(17, 128, 74, .13); --warn: #b86e00; --warn-wash: rgba(184, 110, 0, .14); --info: #1f5fbf;
		--screen: #0d0f0c; --screen-2: #171a15; --screen-rule: #2a2f26; --screen-text: #e8e4d6; --screen-text-2: #9d9a8c;
		--display: "Shoulders", "Arial Narrow", sans-serif;
		--sans: "Instrument", "Helvetica Neue", sans-serif;
		--mono: "JBMono", ui-monospace, monospace;
		--ease: cubic-bezier(.2, .8, .2, 1);
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
	button, input { font: inherit; color: inherit; }
	a { color: inherit; }

	header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--paper); }
	header .mark { font: 800 26px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; text-decoration: none; }
	header .mark b { color: var(--signal); }
	header .what { min-width: 0; flex: 1 1 220px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.group { display: inline-flex; border: 1.5px solid var(--ink); background: var(--paper); }
	.group button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font: 600 13px/1 var(--mono); letter-spacing: .02em; }
	.group button + button { border-left: 1.5px solid var(--ink); }
	.group button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
	.group button:disabled { color: var(--ink-3); cursor: default; }
	.group .rev { padding: 5px 10px; font: 600 13px/1 var(--mono); border-left: 1.5px solid var(--ink); border-right: 1.5px solid var(--ink); min-width: 8ch; text-align: center; align-self: center; }
	.status { font: 600 12px/1 var(--mono); padding: 6px 9px; border: 1.5px solid currentColor; letter-spacing: .03em; text-transform: uppercase; }
	.status.routed { color: var(--ok); }
	.status.preview { color: var(--warn); }
	.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
	[aria-pressed="true"] .live-dot { background: var(--signal); animation: blink 1.6s steps(2) infinite; }
	@keyframes blink { 50% { opacity: .25 } }

	main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 380px; min-height: 0; }
	/* The list: every part by ref, for picking one too small to hit on the board. */
	#list { border-right: 2px solid var(--ink); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--paper-2); }
	#list .search { padding: 10px; border-bottom: 1.5px solid var(--rule-2); }
	#list input { width: 100%; padding: 7px 9px; border: 1.5px solid var(--ink); background: var(--paper); outline: none; font: 500 14px var(--mono); }
	#list input:focus { border-color: var(--signal); }
	#rows { overflow: auto; padding: 4px 0 16px; }
	#rows h3 { margin: 12px 12px 4px; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
	#rows button { display: grid; grid-template-columns: 5.2ch minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 12px; cursor: pointer; align-items: baseline; }
	#rows button:hover { background: var(--paper-3); }
	#rows button[aria-current="true"] { background: var(--ink); color: var(--paper); }
	#rows .ref { font: 700 13px var(--mono); }
	#rows .w { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; opacity: .8; }
	#rows .tag { font: 700 10px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; text-transform: uppercase; }
	#rows .tag.new { color: var(--signal-ink); }
	#rows button[aria-current="true"] .tag.new { color: #ffb59c; }

	/* The board: a dark instrument screen that fills the middle. */
	#stage { position: relative; background: var(--screen); min-height: 0; min-width: 0; }
	#pcb { position: absolute; inset: 0; }
	#hint { position: absolute; right: 12px; top: 12px; text-align: right; max-width: 40%; font: 500 12px var(--mono); color: var(--screen-text-2); pointer-events: none; }
	#banner { position: absolute; left: 12px; top: 12px; right: 45%; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
	#banner span { font: 600 12px/1 var(--mono); color: var(--screen-text); background: var(--screen-2); border: 1px solid var(--screen-rule); padding: 6px 8px; }
	#banner .chg { color: #ffb59c; border-color: #5a2a1a; }
	#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--screen-text-2); font: 500 15px var(--mono); text-align: center; padding: 20px; }

	/* The part card: what it is, why it's there and where that comes from. */
	#card { border-left: 2px solid var(--ink); overflow: auto; padding: 18px 18px 28px; background: var(--paper); }
	#card .none { color: var(--ink-3); margin-top: 30px; }
	#card .ref { font: 800 46px/0.9 var(--display); letter-spacing: .01em; }
	#card .kind { margin-top: 6px; font-weight: 600; }
	#card .mpn { font: 500 13px var(--mono); color: var(--ink-2); margin-top: 2px; }
	#card h4 { margin: 20px 0 6px; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
	#card .why { font-size: 16px; line-height: 1.5; }
	.src { display: inline-block; margin-top: 8px; font: 600 11px/1.3 var(--mono); padding: 4px 6px; border: 1.5px solid currentColor; }
	.src.recorded { color: var(--info); } .src.added { color: var(--signal-ink); } .src.datasheet { color: var(--ok); } .src.rule { color: var(--ink-2); } .src.none { color: var(--warn); }
	.srcd { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
	.added { border: 1.5px solid var(--signal-ink); background: var(--signal-wash); padding: 10px 12px; margin-top: 8px; font-size: 14px; }
	.added p { margin: 4px 0; }
	.added b { font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--signal-ink); margin-right: 6px; }
	.nets { display: flex; flex-wrap: wrap; gap: 6px; }
	.nets span { font: 600 12px/1 var(--mono); padding: 5px 7px; border: 1.5px solid var(--ink); }
	.facts { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
	.meta { font: 500 12px var(--mono); color: var(--ink-3); margin-top: 18px; }

	@media (max-width: 1100px) { main { grid-template-columns: 220px minmax(0, 1fr) 320px; } }
	@media (max-width: 820px) {
		body { overflow: auto; }
		main { grid-template-columns: 1fr; grid-template-rows: 62vh auto auto; }
		#stage { order: 1; min-height: 62vh; }
		#card { order: 2; border-left: 0; border-top: 2px solid var(--ink); }
		#list { order: 3; border-right: 0; border-top: 2px solid var(--ink); max-height: 60vh; }
		header .what { flex-basis: 100%; order: 9; }
		body { overflow-x: hidden; }
		#hint { display: none; }
		#banner { right: 12px; }
	}
	@media (prefers-reduced-motion: reduce) { [aria-pressed="true"] .live-dot { animation: none; } }
</style>
</head>
<body>
<header>
	<a class="mark" id="back" href="/">Bring<b>up</b> · Board</a>
	<span class="what" id="what"></span>
	<span class="group" aria-label="Revision">
		<button id="prev" title="Older revision (←)">◀</button>
		<span class="rev" id="rev">rev –</span>
		<button id="next" title="Newer revision (→)">▶</button>
	</span>
	<span class="group"><button id="live" aria-pressed="true" title="Follow the run: every new revision shows as it lands"><span class="live-dot"></span>Live</button></span>
	<span class="group" aria-label="Side">
		<button data-side="both" aria-pressed="true">Both</button><button data-side="top" aria-pressed="false">Top</button><button data-side="bottom" aria-pressed="false">Bottom</button>
	</span>
	<span class="status" id="status">loading</span>
</header>
<main>
	<nav id="list" aria-label="Parts">
		<div class="search"><input id="q" placeholder="Find a part: U1, 10k, V3V3…" autocomplete="off" spellcheck="false"></div>
		<div id="rows"></div>
	</nav>
	<section id="stage" aria-label="Board">
		<div id="pcb"></div>
		<div id="banner"></div>
		<div id="hint">click a part · scroll to zoom · drag to pan · double-click to fit</div>
		<div id="empty" hidden></div>
	</section>
	<aside id="card" aria-live="polite"><p class="none">Click a part on the board, or pick one from the list, to see what it is and why it's there.</p></aside>
</main>
<script type="module">
	import { mountPcb } from "/pcb-view.js"

	const q = new URLSearchParams(location.search)
	const run = q.get("run")
	const $ = (id) => document.getElementById(id)
	const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
	const S = { view: null, revision: q.has("rev") ? Number(q.get("rev")) : null, live: !q.has("rev"), selected: q.get("part"), filter: "" }
	if (run) $("back").href = `/?run=${encodeURIComponent(run)}`

	const pcb = mountPcb($("pcb"), { onSelect: (ref) => select(ref, false) })

	const SOURCE = { recorded: "recorded when chosen", added: "added for you", datasheet: "datasheet / standard", rule: "generator rule", none: "no reason recorded" }

	async function load(rev) {
		if (!run) return empty("No run given. Open a run and use its board link, or add ?run=<id> to this page's address.")
		const res = await fetch(`/api/runs/${encodeURIComponent(run)}/board${rev ? `?rev=${rev}` : ""}`, { cache: "no-store" }).catch(() => null)
		if (!res || !res.ok) return empty(res?.status === 404 ? "This run has no design contract yet. The board appears as soon as the architect writes one." : "Couldn't load the board.")
		const v = await res.json()
		S.view = v
		S.revision = v.revision
		let circuit = v.preview
		let routed = false
		if (v.routed) {
			const c = await fetch(`/runs/${encodeURIComponent(run)}/files/${v.routed}`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)
			if (c) [circuit, routed] = [c, true]
		}
		// A built board is the truth: items today's generator would add but this board was built without (an older
		// run) are left out of the list, and the banner counts them.
		S.missing = []
		if (routed) {
			const onBoard = new Set(circuit.filter((e) => e.type === "source_component").map((e) => e.name))
			S.missing = v.reasons.filter((r) => !onBoard.has(r.ref)).map((r) => r.ref)
			v.reasons = v.reasons.filter((r) => onBoard.has(r.ref))
		}
		$("empty").hidden = circuit.length > 0
		if (!circuit.length) $("empty").textContent = "No placement yet: the contract has no outline or parts."
		pcb.setParts(v.reasons.map((r) => ({ ref: r.ref, mpn: r.mpn ?? r.value ?? "", role: r.what })))
		pcb.update(circuit, [...v.changed.added, ...v.changed.changed])
		pcb.setMarks?.({ added: v.changed.added, changed: v.changed.changed })
		paintHeader(routed)
		paintList()
		if (S.selected && !v.reasons.some((r) => r.ref === S.selected)) S.selected = null
		paintCard()
		if (S.selected) pcb.highlight(S.selected)
	}

	function empty(text) {
		$("empty").hidden = false
		$("empty").textContent = text
		$("status").textContent = "no board"
		$("status").className = "status"
	}

	function paintHeader(routed) {
		const v = S.view
		$("what").textContent = `${v.summary || run}${v.widthMm ? ` · ${v.widthMm}×${v.heightMm} mm` : ""} · ${v.reasons.length} items`
		$("rev").textContent = `rev ${v.revision}`
		const i = v.revisions.indexOf(v.revision)
		$("prev").disabled = i <= 0
		$("next").disabled = i < 0 || i >= v.revisions.length - 1
		const st = $("status")
		st.className = `status ${routed ? "routed" : "preview"}`
		st.textContent = routed ? `routed · rev ${v.revision}` : v.routedRevision ? `placement · routed up to rev ${v.routedRevision}` : "placement · not routed yet"
		st.title = routed ? "The board as built: tscircuit's routed board for this revision." : "Placement straight from the contract, without traces. Routing takes about 50 s after a change."
		const c = v.changed
		const parts = [...c.added.map((r) => `+${r}`), ...c.removed.map((r) => `−${r}`), ...c.changed.map((r) => `~${r}`)]
		$("banner").innerHTML = (routed ? "" : `<span>placement preview: no traces yet</span>`) + (S.missing?.length ? `<span title="${esc(S.missing.join(", "))}">built before ${S.missing.length} newer item${S.missing.length === 1 ? "" : "s"} existed</span>` : "") + (parts.length ? `<span class="chg">since the revision before: ${esc(parts.slice(0, 14).join(" "))}${parts.length > 14 ? ` and ${parts.length - 14} more` : ""}</span>` : "")
		history.replaceState(null, "", `/board?run=${encodeURIComponent(run)}${S.live ? "" : `&rev=${v.revision}`}${S.selected ? `&part=${encodeURIComponent(S.selected)}` : ""}`)
	}

	// Groups: the parts the design chose, what Bringup added on its own (passives, crystal), the underside.
	function paintList() {
		const v = S.view
		const f = S.filter.toLowerCase()
		const hit = (r) => !f || [r.ref, r.what, r.mpn, r.value, ...r.nets].some((x) => String(x ?? "").toLowerCase().includes(f))
		const isNew = new Set(v.changed.added), moved = new Set(v.changed.changed)
		// A passive is a support part whether the parts list carries it or the generator adds it.
		const passive = (r) => r.role === "resistor" || r.role === "capacitor" || /crystal/.test(r.what)
		const groups = [
			["Chosen parts", v.reasons.filter((r) => r.side === "top" && !passive(r) && !r.generated)],
			["Passives (support parts)", v.reasons.filter((r) => r.side === "top" && (passive(r) || r.generated))],
			["Underside", v.reasons.filter((r) => r.side === "bottom")],
		]
		const byRef = (a, b) => a.ref.localeCompare(b.ref, "en", { numeric: true })
		$("rows").innerHTML = groups.map(([name, rows]) => {
			const shown = rows.filter(hit).sort(byRef)
			return shown.length ? `<h3>${name}</h3>` + shown.map((r) => `<button data-ref="${esc(r.ref)}" aria-current="${r.ref === S.selected}"><span class="ref">${esc(r.ref)}</span><span class="w">${esc(r.value ? `${r.what}` : r.mpn ?? r.what)}</span>${isNew.has(r.ref) ? `<span class="tag new" title="added since the revision before">new</span>` : moved.has(r.ref) ? `<span class="tag" title="moved or swapped since the revision before">moved</span>` : "<span></span>"}</button>`).join("") : ""
		}).join("") || `<p style="padding:12px;color:var(--ink-3)">Nothing matches “${esc(S.filter)}”.</p>`
	}

	function paintCard() {
		const r = S.view?.reasons.find((x) => x.ref === S.selected)
		if (!r) {
			$("card").innerHTML = `<p class="none">Click a part on the board, or pick one from the list, to see what it is and why it's there.</p>`
			return
		}
		const a = r.added
		$("card").innerHTML = `
			<div class="ref">${esc(r.ref)}</div>
			<div class="kind">${esc(r.what)}</div>
			${r.mpn && !r.what.includes(r.mpn) ? `<div class="mpn">${esc(r.mpn)}</div>` : ""}
			<h4>Why it's here</h4>
			<div class="why">${esc(r.why)}</div>
			<span class="src ${r.source.kind}">${esc(SOURCE[r.source.kind])}</span>
			<div class="srcd">${esc(r.source.detail)}</div>
			${a ? `<h4>Added for you</h4><div class="added"><p>${esc(a.what)}</p><p><b>Cost</b>${esc(a.cost)}</p>${a.change ? `<p><b>Change</b>${esc(a.change)}</p>` : ""}</div>` : ""}
			${r.nets.length ? `<h4>Connects to</h4><div class="nets">${r.nets.map((n) => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
			${r.facts ? `<h4>From the catalog</h4><div class="facts">${esc(r.facts)}</div>` : ""}
			<div class="meta">${r.side === "bottom" ? "underside" : "top side"} · revision ${S.view.revision}${r.generated ? " · placed by Bringup, not in the parts list" : ""}</div>`
	}

	function select(ref, zoom) {
		S.selected = ref
		pcb.highlight(ref)
		if (ref && zoom) pcb.zoomTo?.(ref)
		paintList()
		paintCard()
		if (S.view) history.replaceState(null, "", `/board?run=${encodeURIComponent(run)}${S.live ? "" : `&rev=${S.view.revision}`}${ref ? `&part=${encodeURIComponent(ref)}` : ""}`)
	}

	$("rows").addEventListener("click", (e) => {
		const b = e.target.closest("button[data-ref]")
		if (b) select(b.dataset.ref, true)
	})
	$("q").addEventListener("input", (e) => {
		S.filter = e.target.value.trim()
		paintList()
	})
	$("q").addEventListener("keydown", (e) => {
		if (e.key !== "Enter") return
		const first = $("rows").querySelector("button[data-ref]")
		if (first) select(first.dataset.ref, true)
	})
	const step = (d) => {
		const v = S.view
		if (!v) return
		const i = v.revisions.indexOf(v.revision) + d
		if (i < 0 || i >= v.revisions.length) return
		setLive(i === v.revisions.length - 1)
		load(v.revisions[i])
	}
	$("prev").addEventListener("click", () => step(-1))
	$("next").addEventListener("click", () => step(1))
	function setLive(on) {
		S.live = on
		$("live").setAttribute("aria-pressed", String(on))
	}
	$("live").addEventListener("click", () => {
		setLive(!S.live)
		if (S.live) load(null)
	})
	for (const b of document.querySelectorAll("[data-side]"))
		b.addEventListener("click", () => {
			for (const o of document.querySelectorAll("[data-side]")) o.setAttribute("aria-pressed", String(o === b))
			pcb.setView(b.dataset.side)
		})
	document.addEventListener("keydown", (e) => {
		if (e.target.closest("input")) return
		if (e.key === "Escape") select(null, false)
		if (e.key === "/") { e.preventDefault(); $("q").focus() }
		if (e.key === "ArrowLeft") step(-1)
		if (e.key === "ArrowRight") step(1)
	})

	// Live: the run's own event stream. A new revision or a built board reloads the newest view (placement at once,
	// the routed board when its build lands); a page looking at an older revision stays where it is.
	if (run) {
		let timer = null
		const es = new EventSource(`/runs/${encodeURIComponent(run)}/events`)
		es.onmessage = (m) => {
			if (!S.live) return
			let e
			try { e = JSON.parse(m.data) } catch { return }
			if (!["contract.changed", "artifact.ready", "design.settled", "design.ready"].includes(e?.type)) return
			clearTimeout(timer)
			timer = setTimeout(() => load(null), 250)
		}
	}
	load(S.live ? null : S.revision)
</script>
</body>
</html>
