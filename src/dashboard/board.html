<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bringup · Board</title>
<style>
	/* Bringup's board page: the run page's drafting paper around one big instrument screen, the board. */
	@font-face { font-family: "Shoulders"; src: url("/fonts/BigShouldersDisplay.woff") format("woff"); font-weight: 100 900; font-display: swap; }
	@font-face { font-family: "Instrument"; src: url("/fonts/InstrumentSans.woff") format("woff"); font-weight: 400 700; font-stretch: 75% 100%; font-display: swap; }
	@font-face { font-family: "JBMono"; src: url("/fonts/JetBrainsMono.woff") format("woff"); font-weight: 100 800; font-display: swap; }
	:root {
		--paper: #efe9dc; --paper-2: #e6dfcf; --paper-3: #dcd3c0; --rule: #c9bea7; --rule-2: #b3a78d;
		--ink: #16140f; --ink-2: #4b463c; --ink-3: #807865;
		--signal: #ff4a17; --signal-ink: #c2330a; --signal-wash: rgba(255, 74, 23, .12);
		--ok: #11804a; --ok-wash: rgba(17, 128, 74, .13); --warn: #b86e00; --warn-wash: rgba(184, 110, 0, .14); --info: #1f5fbf;
		--screen: #0d0f0c; --screen-2: #171a15; --screen-rule: #2a2f26; --screen-text: #e8e4d6; --screen-text-2: #9d9a8c;
		--display: "Shoulders", "Arial Narrow", sans-serif;
		--sans: "Instrument", "Helvetica Neue", sans-serif;
		--mono: "JBMono", ui-monospace, monospace;
		--ease: cubic-bezier(.2, .8, .2, 1);
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--sans); display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); overflow: hidden; }
	button, input { font: inherit; color: inherit; }
	a { color: inherit; }

	header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--paper); }
	header .mark { font: 800 26px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; text-decoration: none; }
	header .mark b { color: var(--signal); }
	header .what { min-width: 0; flex: 1 1 220px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.group { display: inline-flex; border: 1.5px solid var(--ink); background: var(--paper); }
	.group button { border: 0; background: none; padding: 5px 11px; cursor: pointer; font: 600 13px/1 var(--mono); letter-spacing: .02em; }
	.group button + button { border-left: 1.5px solid var(--ink); }
	.group button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
	.group button:disabled { color: var(--ink-3); cursor: default; }
	.group .rev { padding: 5px 10px; font: 600 13px/1 var(--mono); border-left: 1.5px solid var(--ink); border-right: 1.5px solid var(--ink); min-width: 8ch; text-align: center; align-self: center; }
	.status { font: 600 12px/1 var(--mono); padding: 6px 9px; border: 1.5px solid currentColor; letter-spacing: .03em; text-transform: uppercase; }
	.status.routed { color: var(--ok); }
	.status.preview { color: var(--warn); }
	.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-right: 6px; vertical-align: 1px; }
	[aria-pressed="true"] .live-dot { background: var(--signal); animation: blink 1.6s steps(2) infinite; }
	@keyframes blink { 50% { opacity: .25 } }

	main { display: grid; grid-template-columns: 260px minmax(0, 1fr) 380px; min-height: 0; }
	/* The list: every part by ref, for picking one too small to hit on the board. */
	#list { border-right: 2px solid var(--ink); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--paper-2); }
	#list .search { padding: 10px; border-bottom: 1.5px solid var(--rule-2); }
	#list input { width: 100%; padding: 7px 9px; border: 1.5px solid var(--ink); background: var(--paper); outline: none; font: 500 14px var(--mono); }
	#list input:focus { border-color: var(--signal); }
	#rows { overflow: auto; padding: 4px 0 16px; }
	#rows h3 { margin: 12px 12px 4px; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
	#rows button { display: grid; grid-template-columns: 5.2ch minmax(0, 1fr) auto; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 12px; cursor: pointer; align-items: baseline; }
	#rows button:hover { background: var(--paper-3); }
	#rows button[aria-current="true"] { background: var(--ink); color: var(--paper); }
	#rows .ref { font: 700 13px var(--mono); }
	#rows .w { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; opacity: .8; }
	#rows .tag { font: 700 10px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; text-transform: uppercase; }
	#rows .tag.new { color: var(--signal-ink); }
	#rows button[aria-current="true"] .tag.new { color: #ffb59c; }

	/* The board: a dark instrument screen that fills the middle. */
	#stage { position: relative; background: var(--screen); min-height: 0; min-width: 0; }
	#pcb { position: absolute; inset: 0; }
	#hint { position: absolute; right: 12px; top: 12px; text-align: right; max-width: 40%; font: 500 12px var(--mono); color: var(--screen-text-2); pointer-events: none; }
	#banner { position: absolute; left: 12px; top: 12px; right: 45%; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
	#banner span { font: 600 12px/1 var(--mono); color: var(--screen-text); background: var(--screen-2); border: 1px solid var(--screen-rule); padding: 6px 8px; }
	#banner .chg { color: #ffb59c; border-color: #5a2a1a; }
	#empty[hidden] { display: none; }
	#empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--screen-text-2); font: 500 15px var(--mono); text-align: center; padding: 20px; }

	/* The part card: what it is, why it's there and where that comes from. */
	#card { border-left: 2px solid var(--ink); overflow: auto; padding: 18px 18px 28px; background: var(--paper); }
	#card .none { color: var(--ink-3); margin-top: 30px; }
	#card .ref { font: 800 46px/0.9 var(--display); letter-spacing: .01em; }
	#card .kind { margin-top: 6px; font-weight: 600; }
	#card .mpn { font: 500 13px var(--mono); color: var(--ink-2); margin-top: 2px; }
	#card h4 { margin: 20px 0 6px; font: 700 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
	#card .why { font-size: 16px; line-height: 1.5; }
	.src { display: inline-block; margin-top: 8px; font: 600 11px/1.3 var(--mono); padding: 4px 6px; border: 1.5px solid currentColor; }
	.src.recorded { color: var(--info); } .src.added { color: var(--signal-ink); } .src.datasheet { color: var(--ok); } .src.rule { color: var(--ink-2); } .src.none { color: var(--warn); }
	.srcd { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
	.added { border: 1.5px solid var(--signal-ink); background: var(--signal-wash); padding: 10px 12px; margin-top: 8px; font-size: 14px; }
	.added p { margin: 4px 0; }
	.added b { font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--signal-ink); margin-right: 6px; }
	.nets { display: flex; flex-wrap: wrap; gap: 6px; }
	.nets span { font: 600 12px/1 var(--mono); padding: 5px 7px; border: 1.5px solid var(--ink); }
	.facts { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
	.meta { font: 500 12px var(--mono); color: var(--ink-3); margin-top: 18px; }
	/* Swap for: the catalog's other parts for this role, what each would change, and the request it sends. */
	.swaps { display: grid; gap: 8px; }
	.swap { border: 1.5px solid var(--rule-2); background: var(--paper-2); padding: 9px 10px; }
	.swap .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
	.swap .m { font: 700 13px var(--mono); }
	.swap .l, .swap .stock { font: 500 12px var(--mono); color: var(--ink-3); }
	.swap ul { margin: 6px 0 8px; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
	.swap button { border: 1.5px solid var(--ink); background: var(--paper); padding: 5px 10px; cursor: pointer; font: 600 12px/1 var(--mono); }
	.swap button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
	.swap button:disabled { color: var(--ink-3); border-color: var(--rule-2); cursor: default; }
	.swapnote { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
	.swapnote code { display: block; margin-top: 6px; padding: 6px 8px; font: 500 12px/1.4 var(--mono); background: var(--paper-2); border: 1px solid var(--rule-2); word-break: break-word; user-select: all; }
	.pending { border: 1.5px solid var(--info); color: var(--info); padding: 8px 10px; font-size: 13px; margin-bottom: 8px; }

	/* Moves: a draft of moves, each checked in code as it is made, sent to the run as one change request. */
	#side { border-left: 2px solid var(--ink); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--paper); }
	#side #card { border-left: 0; }
	#draft { border-bottom: 2px solid var(--ink); background: var(--paper-2); padding: 12px 16px; max-height: 45vh; overflow: auto; }
	#draft[hidden] { display: none; }
	#draft .h { display: flex; align-items: baseline; gap: 8px; }
	#draft .h b { font: 800 22px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
	#draft .h span { font: 500 12px var(--mono); color: var(--ink-3); }
	#draft ol { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
	#draft ol > li { border: 1.5px solid var(--rule-2); background: var(--paper); padding: 7px 9px; font-size: 13px; }
	#draft li .mv { font: 700 12px var(--mono); }
	#draft ol > li ul { margin: 4px 0 0; padding-left: 16px; color: var(--ink-2); }
	.scope { font: 700 10px/1 var(--mono); padding: 3px 5px; border: 1px solid currentColor; text-transform: uppercase; margin-left: 6px; vertical-align: 1px; }
	.scope.board { color: var(--ink-2); } .scope.case { color: var(--info); } .scope.system { color: var(--signal-ink); }
	#draft .also { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
	#draft .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
	.btn { border: 1.5px solid var(--ink); background: var(--paper); padding: 6px 10px; cursor: pointer; font: 600 12px/1 var(--mono); }
	.btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
	.btn.primary { background: var(--ink); color: var(--paper); }
	.btn.primary:hover:not(:disabled) { background: var(--signal); border-color: var(--signal); }
	.btn:disabled { color: var(--ink-3); border-color: var(--rule-2); background: none; cursor: default; }
	.refused { border: 1.5px solid var(--signal-ink); background: var(--signal-wash); color: var(--ink); padding: 8px 10px; font-size: 13px; margin-top: 8px; }
	.refused b { font: 700 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--signal-ink); display: block; margin-bottom: 3px; }
	.mover { display: grid; gap: 8px; }
	.mover .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font: 500 13px var(--mono); }
	.mover input[type=number] { width: 9ch; padding: 4px 6px; border: 1.5px solid var(--ink); background: var(--paper); font: 500 13px var(--mono); }
	.mover input[type=range] { flex: 1 1 140px; accent-color: var(--signal); }
	.mover .nudge { display: inline-grid; grid-template-columns: repeat(3, 26px); gap: 2px; }
	.mover .nudge button { height: 24px; border: 1.5px solid var(--ink); background: var(--paper); cursor: pointer; font: 600 12px/1 var(--mono); padding: 0; }
	.mover .nudge button:hover { background: var(--ink); color: var(--paper); }
	.mover .edges button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
	.checking { font: 500 12px var(--mono); color: var(--ink-3); }
	#banner .draft { color: #ffd88a; border-color: #5a4a1a; }

	@media (max-width: 1100px) { main { grid-template-columns: 220px minmax(0, 1fr) 340px; } }
	@media (max-width: 820px) {
		body { overflow: auto; }
		main { grid-template-columns: 1fr; grid-template-rows: 62vh auto auto; }
		#stage { order: 1; min-height: 62vh; }
		#side { order: 2; border-left: 0; border-top: 2px solid var(--ink); }
		#list { order: 3; border-right: 0; border-top: 2px solid var(--ink); max-height: 60vh; }
		header .what { flex-basis: 100%; order: 9; }
		body { overflow-x: hidden; }
		#hint { display: none; }
		#banner { right: 12px; }
	}
	@media (prefers-reduced-motion: reduce) { [aria-pressed="true"] .live-dot { animation: none; } }
</style>
</head>
<body>
<header>
	<a class="mark" id="back" href="/">Bring<b>up</b> · Board</a>
	<span class="what" id="what"></span>
	<span class="group" aria-label="Revision">
		<button id="prev" title="Older revision (←)">◀</button>
		<span class="rev" id="rev">rev –</span>
		<button id="next" title="Newer revision (→)">▶</button>
	</span>
	<span class="group"><button id="live" aria-pressed="true" title="Follow the run: every new revision shows as it lands"><span class="live-dot"></span>Live</button></span>
	<span class="group" aria-label="Side">
		<button data-side="both" aria-pressed="true">Both</button><button data-side="top" aria-pressed="false">Top</button><button data-side="bottom" aria-pressed="false">Bottom</button>
	</span>
	<span class="status" id="status">loading</span>
</header>
<main>
	<nav id="list" aria-label="Parts">
		<div class="search"><input id="q" placeholder="Find a part: U1, 10k, V3V3…" autocomplete="off" spellcheck="false"></div>
		<div id="rows"></div>
	</nav>
	<section id="stage" aria-label="Board">
		<div id="pcb"></div>
		<div id="banner"></div>
		<div id="hint">click a part · drag the chosen part to move it · scroll to zoom · drag to pan · double-click to fit</div>
		<div id="empty" hidden></div>
	</section>
	<div id="side">
		<section id="draft" hidden aria-live="polite" aria-label="Your moves"></section>
		<aside id="card" aria-live="polite"><p class="none">Click a part on the board, or pick one from the list, to see what it is and why it's there.</p></aside>
	</div>
</main>
<script type="module">
	import { mountPcb } from "/pcb-view.js"

	const q = new URLSearchParams(location.search)
	const run = q.get("run")
	const $ = (id) => document.getElementById(id)
	const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
	const S = { view: null, revision: q.has("rev") ? Number(q.get("rev")) : null, live: !q.has("rev"), selected: q.get("part"), filter: "" }
	if (run) $("back").href = `/?run=${encodeURIComponent(run)}`

	const pcb = mountPcb($("pcb"), { onSelect: (ref) => select(ref, false), draggable: (ref) => ref === S.selected && editable() && !!S.view?.movable?.[ref], onDrop: (ref, dx, dy) => dropped(ref, dx, dy) })

	const SOURCE = { recorded: "recorded when chosen", added: "added for you", datasheet: "datasheet / standard", rule: "generator rule", none: "no reason recorded" }

	async function load(rev) {
		if (!run) return empty("No run given. Open a run and use its board link, or add ?run=<id> to this page's address.")
		const res = await fetch(`/api/runs/${encodeURIComponent(run)}/board${rev ? `?rev=${rev}` : ""}`, { cache: "no-store" }).catch(() => null)
		if (!res || !res.ok) return empty(res?.status === 404 ? "This run has no design contract yet. The board appears as soon as the architect writes one." : "Couldn't load the board.")
		const v = await res.json()
		S.view = v
		S.revision = v.revision
		let circuit = v.preview
		let routed = false
		if (v.routed) {
			const c = await fetch(`/runs/${encodeURIComponent(run)}/files/${v.routed}`, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null)
			if (c) [circuit, routed] = [c, true]
		}
		// A built board is the truth: items today's generator would add but this board was built without (an older
		// run) are left out of the list, and the banner counts them.
		S.missing = []
		if (routed) {
			const onBoard = new Set(circuit.filter((e) => e.type === "source_component").map((e) => e.name))
			S.missing = v.reasons.filter((r) => !onBoard.has(r.ref)).map((r) => r.ref)
			v.reasons = v.reasons.filter((r) => onBoard.has(r.ref))
		}
		$("empty").hidden = circuit.length > 0
		if (!circuit.length) $("empty").textContent = "No placement yet: the contract has no outline or parts."
		pcb.setParts(v.reasons.map((r) => ({ ref: r.ref, mpn: r.mpn ?? r.value ?? "", role: r.what })))
		// Moves are drawn on the revision they were made on: a new revision (the run moved on, or the moves landed) ends
		// the draft, and the card says so.
		if (S.draft.base !== null && S.draft.base !== v.revision) endDraft(S.draft.sent ? `Your moves were sent; the run answered from revision ${v.revision} on (the board shows the newest).` : `The run moved on to revision ${v.revision}, so your unsent moves were dropped: make them again on this revision.`)
		S.circuit = circuit
		S.routed = routed
		if (S.draft.moves.length && S.draft.check) pcb.update(S.draft.check.preview, [])
		else pcb.update(circuit, [...v.changed.added, ...v.changed.changed])
		pcb.setMarks?.({ added: v.changed.added, changed: v.changed.changed })
		paintHeader(routed)
		paintList()
		if (S.selected && !v.reasons.some((r) => r.ref === S.selected)) S.selected = null
		paintCard()
		paintDraft()
		if (S.selected) pcb.highlight(S.selected)
	}

	function empty(text) {
		$("empty").hidden = false
		$("empty").textContent = text
		$("status").textContent = "no board"
		$("status").className = "status"
	}

	function paintHeader(routed) {
		const v = S.view
		$("what").textContent = `${v.summary || run}${v.widthMm ? ` · ${v.widthMm}×${v.heightMm} mm` : ""} · ${v.reasons.length} items`
		$("rev").textContent = `rev ${v.revision}`
		const i = v.revisions.indexOf(v.revision)
		$("prev").disabled = i <= 0
		$("next").disabled = i < 0 || i >= v.revisions.length - 1
		const st = $("status")
		st.className = `status ${routed ? "routed" : "preview"}`
		st.textContent = routed ? `routed · rev ${v.revision}` : v.routedRevision ? `placement · routed up to rev ${v.routedRevision}` : "placement · not routed yet"
		st.title = routed ? "The board as built: tscircuit's routed board for this revision." : "Placement straight from the contract, without traces. Routing takes about 50 s after a change."
		const c = v.changed
		const parts = [...c.added.map((r) => `+${r}`), ...c.removed.map((r) => `−${r}`), ...c.changed.map((r) => (c.swapped?.includes(r) ? `⇄${r} swapped` : `~${r}`))]
		$("banner").innerHTML = (S.draft.moves.length ? `<span class="draft">your moves, not sent: placement only</span>` : "") + (routed || S.draft.moves.length ? "" : `<span>placement preview: no traces yet</span>`) + (S.missing?.length ? `<span title="${esc(S.missing.join(", "))}">built before ${S.missing.length} newer item${S.missing.length === 1 ? "" : "s"} existed</span>` : "") + (parts.length && !S.draft.moves.length ? `<span class="chg">since the revision before: ${esc(parts.slice(0, 14).join(" "))}${parts.length > 14 ? ` and ${parts.length - 14} more` : ""}</span>` : "")
		history.replaceState(null, "", `/board?run=${encodeURIComponent(run)}${S.live ? "" : `&rev=${v.revision}`}${S.selected ? `&part=${encodeURIComponent(S.selected)}` : ""}`)
	}

	// Groups: the parts the design chose, what Bringup added on its own (passives, crystal), the underside.
	function paintList() {
		const v = S.view
		const f = S.filter.toLowerCase()
		const hit = (r) => !f || [r.ref, r.what, r.mpn, r.value, ...r.nets].some((x) => String(x ?? "").toLowerCase().includes(f))
		const isNew = new Set(v.changed.added), moved = new Set(v.changed.changed), swapped = new Set(v.changed.swapped ?? [])
		// A passive is a support part whether the parts list carries it or the generator adds it.
		const passive = (r) => r.role === "resistor" || r.role === "capacitor" || /crystal/.test(r.what)
		const groups = [
			["Chosen parts", v.reasons.filter((r) => r.side === "top" && !passive(r) && !r.generated)],
			["Passives (support parts)", v.reasons.filter((r) => r.side === "top" && (passive(r) || r.generated))],
			["Underside", v.reasons.filter((r) => r.side === "bottom")],
		]
		const byRef = (a, b) => a.ref.localeCompare(b.ref, "en", { numeric: true })
		$("rows").innerHTML = groups.map(([name, rows]) => {
			const shown = rows.filter(hit).sort(byRef)
			return shown.length ? `<h3>${name}</h3>` + shown.map((r) => `<button data-ref="${esc(r.ref)}" aria-current="${r.ref === S.selected}"><span class="ref">${esc(r.ref)}</span><span class="w">${esc(r.value ? `${r.what}` : r.mpn ?? r.what)}</span>${isNew.has(r.ref) ? `<span class="tag new" title="added since the revision before">new</span>` : swapped.has(r.ref) ? `<span class="tag new" title="another part number since the revision before">swapped</span>` : moved.has(r.ref) ? `<span class="tag" title="moved since the revision before">moved</span>` : "<span></span>"}</button>`).join("") : ""
		}).join("") || `<p style="padding:12px;color:var(--ink-3)">Nothing matches “${esc(S.filter)}”.</p>`
	}

	function paintCard() {
		const r = S.view?.reasons.find((x) => x.ref === S.selected)
		if (!r) {
			$("card").innerHTML = `<p class="none">Click a part on the board, or pick one from the list, to see what it is and why it's there.</p>`
			return
		}
		const a = r.added
		$("card").innerHTML = `
			<div class="ref">${esc(r.ref)}</div>
			<div class="kind">${esc(r.what)}</div>
			${r.mpn && !r.what.includes(r.mpn) ? `<div class="mpn">${esc(r.mpn)}</div>` : ""}
			<h4>Why it's here</h4>
			<div class="why">${esc(r.why)}</div>
			<span class="src ${r.source.kind}">${esc(SOURCE[r.source.kind])}</span>
			<div class="srcd">${esc(r.source.detail)}</div>
			${a ? `<h4>Added for you</h4><div class="added"><p>${esc(a.what)}</p><p><b>Cost</b>${esc(a.cost)}</p>${a.change ? `<p><b>Change</b>${esc(a.change)}</p>` : ""}</div>` : ""}
			${moveSection(r)}
			${swapSection(r)}
			${r.nets.length ? `<h4>Connects to</h4><div class="nets">${r.nets.map((n) => `<span>${esc(n)}</span>`).join("")}</div>` : ""}
			${r.facts ? `<h4>From the catalog</h4><div class="facts">${esc(r.facts)}</div>` : ""}
			<div class="meta">${r.side === "bottom" ? "underside" : "top side"} · revision ${S.view.revision}${r.generated ? " · placed by Bringup, not in the parts list" : ""}</div>`
	}

	// Swap for: the card sends one fixed sentence through the run's change requests, the same path as a typed request,
	// so the owners decide and the code checks run; the board updates live when the new revision lands.
	const LIVE = new Set(["running", "bench live", "waiting for a change"])
	S.pending = new Map()
	function swapSection(r) {
		const options = S.view.swaps?.[r.ref] ?? []
		if (r.generated) return ""
		if (!options.length) {
			const why = r.role === "mcu" ? "Changing the microcontroller changes the pins, the firmware and its toolchain: ask for it in words on the run page (for example “use an STM32G031”)."
				: r.role === "resistor" || r.role === "capacitor" ? "Its value comes from the reason above, so it isn't swapped from a list: ask for another value on the run page if you need one."
				: "The catalog has no other part for this role yet."
			return `<h4>Swap for</h4><div class="swapnote">${esc(why)}</div>`
		}
		const latest = S.view.revision === S.view.revisions.at(-1)
		const live = LIVE.has(S.view.status)
		const p = S.pending.get(r.ref)
		const done = p && r.mpn && r.mpn.toUpperCase() === p.mpn.toUpperCase()
		if (done) S.pending.delete(r.ref)
		const blocked = !latest ? "This is an older revision: go to the newest one to swap." : !live ? "This run has stopped, so it can't take a change." : ""
		return `<h4>Swap for</h4>
			${p && !done ? `<div class="pending">Sent: swap to ${esc(p.mpn)}. The parts agent and the owners of the affected fields decide; the board updates here when the new revision lands.</div>` : ""}
			${done ? `<div class="pending">Swapped to ${esc(r.mpn)} in revision ${S.view.revision}.</div>` : ""}
			${blocked ? `<div class="swapnote" style="margin-bottom:8px">${esc(blocked)}${latest ? " Start a run and send the request under the part you want." : ""}</div>` : ""}
			<div class="swaps">${options.map((o, i) => `<div class="swap">
				<div class="top"><span class="m">${esc(o.mpn)}</span>${o.lcsc ? `<span class="l">${esc(o.lcsc)}</span>` : ""}<span class="stock">${o.stock === null ? "stock not checked" : o.inStock === false || o.stock <= 0 ? "out of stock" : `${o.stock} in stock`}${o.priceUsd !== null ? ` · $${o.priceUsd}` : ""}</span></div>
				<ul>${o.changes.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
				<button data-swap="${i}" ${blocked || (p && !done) ? "disabled" : ""}>Request this swap</button>
				${blocked && latest ? `<div class="swapnote"><code>${esc(o.request)}</code></div>` : ""}
			</div>`).join("")}</div>`
	}
	$("card").addEventListener("click", async (e) => {
		const b = e.target.closest("button[data-swap]")
		if (!b || b.disabled) return
		const ref = S.selected
		const o = S.view.swaps[ref][Number(b.dataset.swap)]
		b.disabled = true
		try {
			const res = await fetch(`/api/runs/${encodeURIComponent(run)}/requests`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: o.request }) })
			if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.status)
			S.pending.set(ref, { mpn: o.mpn })
			// Follow the run so the swap shows as soon as it lands.
			if (!S.live) { setLive(true); load(null) }
		} catch (err) {
			b.disabled = false
			b.textContent = `Couldn't send (${err.message ?? err}): try again`
			return
		}
		paintCard()
	})

	// Moves (step 3): each move is checked in code on the server (POST /board/check, ~0.1 s) as it is made. One the
	// design can't take is refused at once, with the reason, and never joins the draft; the draft is sent as one change
	// request, so the owners write it and the run's checks and review see the whole batch once.
	S.draft = { base: null, moves: [], check: null, refused: null, busy: false, sent: false, note: null }
	const editable = () => !!S.view && S.view.revision === S.view.revisions.at(-1)
	const r1 = (n) => Math.round(n * 10) / 10
	// Where an item is now: as the draft moved it, else where the revision has it.
	function where(ref) {
		const m = S.draft.moves.find((x) => x.ref === ref)
		const was = S.view?.movable?.[ref]
		if (!was) return null
		if (!m) return was
		// Handed back to the layout: where the checked draft has the layout put it, at no turn.
		if (m.release) {
			const to = /\((-?[\d.]+), (-?[\d.]+)\) mm/.exec(S.draft.check?.moves.find((x) => x.ref === ref)?.to ?? "")
			return to ? { ...was, xMm: Number(to[1]), yMm: Number(to[2]), rotationDeg: 0 } : was
		}
		return was.kind === "part" ? { ...was, xMm: m.xMm, yMm: m.yMm, rotationDeg: m.rotationDeg ?? 0 } : { ...was, edge: m.edge, offsetMm: m.offsetMm }
	}
	async function propose(move) {
		if (!editable()) return
		// One check at a time; a move made meanwhile (typing x, then y) waits, and only the latest is checked.
		if (S.draft.busy) {
			S.draft.queued = move
			return
		}
		const moves = [...S.draft.moves.filter((m) => m.ref !== move.ref), move]
		S.draft.busy = true
		S.draft.refused = null
		paintDraft()
		let res = null
		try {
			const r = await fetch(`/api/runs/${encodeURIComponent(run)}/board/check`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ rev: S.view.revision, moves }) })
			res = await r.json()
			if (!r.ok) throw new Error(res.error ?? r.status)
		} catch (err) {
			S.draft.busy = false
			S.draft.queued = null
			S.draft.refused = { ref: move.ref, problems: [{ message: `Couldn't check the move (${err.message ?? err}).` }] }
			redraw()
			return
		}
		S.draft.busy = false
		const queued = S.draft.queued
		S.draft.queued = null
		if (res.ok) {
			S.draft = { ...S.draft, base: S.view.revision, moves, check: res, refused: null, note: null, sent: false }
			if (S.live) setLive(false) // the page stays on this revision while you edit; Send turns Live back on
		} else S.draft.refused = { ref: move.ref, problems: res.problems, move }
		redraw([move.ref])
		if (queued) propose(queued)
	}
	function redraw(changed = []) {
		if (S.draft.moves.length && S.draft.check) pcb.update(S.draft.check.preview, changed)
		else if (S.circuit) pcb.update(S.circuit, [])
		if (S.selected) pcb.highlight(S.selected)
		paintHeader(S.routed)
		paintCard()
		paintDraft()
	}
	function endDraft(note) {
		S.draft = { base: null, moves: [], check: null, refused: null, busy: false, sent: false, note }
	}
	function dropped(ref, dx, dy) {
		const now = where(ref)
		if (!now) return redraw()
		if (now.kind === "part") return propose(partMove(ref, now.xMm + dx, now.yMm + dy, now.rotationDeg))
		// A connector goes to the edge nearest where it was dropped, at the spot along it.
		const W = S.view.widthMm, H = S.view.heightMm
		const e = pcb.extentOf(ref)
		const cx = (e ? (e.x0 + e.x1) / 2 : 0) + dx, cy = (e ? (e.y0 + e.y1) / 2 : 0) + dy
		const d = { left: cx + W / 2, right: W / 2 - cx, bottom: cy + H / 2, top: H / 2 - cy }
		const edge = Object.entries(d).sort((a, b) => a[1] - b[1])[0][0]
		propose({ ref, edge, offsetMm: r1(edge === "left" || edge === "right" ? cy + H / 2 : cx + W / 2) })
	}

	// What the card shows and the next nudge or turn starts from: a refused move's values stay there, so a spot that only
	// works turned (or a turn that only fits elsewhere) is reached in two steps, each checked.
	function shownAt(ref) {
		const m = where(ref)
		const f = S.draft.refused
		if (!m || m.kind !== "part" || f?.ref !== ref || !f.move || !("xMm" in f.move)) return m
		return { ...m, xMm: f.move.xMm, yMm: f.move.yMm, rotationDeg: f.move.rotationDeg ?? 0 }
	}
	// A part's move keeps its turn; a turn of 0 isn't written (the request's old form).
	const partMove = (ref, x, y, rot) => ({ ref, xMm: r1(x), yMm: r1(y), ...(rot ? { rotationDeg: rot } : {}) })
	function moveSection(r) {
		const m = shownAt(r.ref)
		const fixed = S.view.fixed?.[r.ref]
		if (!m) return r.side === "bottom" || r.generated ? `<h4>Move</h4><div class="swapnote">${r.side === "bottom" ? "Underside pads are placed after every part, in the room left: they follow the parts." : "Bringup places it beside the part it serves, by its rule above: it follows that part."}</div>` : fixed ? `<h4>Move</h4><div class="swapnote">${esc(fixed)}</div>` : ""
		if (!editable()) return `<h4>Move</h4><div class="swapnote">This is an older revision: go to the newest one to move parts.</div>`
		const refused = S.draft.refused?.ref === r.ref ? `<div class="refused"><b>Refused: not added to your moves</b>${S.draft.refused.problems.map((p) => esc(p.message)).join("<br>")}${S.draft.refused.move && "xMm" in S.draft.refused.move ? `<br><i>The values above are the refused ones: nudge or turn from there, or press Esc to go back.</i>` : ""}</div>` : ""
		if (m.kind === "part")
			return `<h4>Move</h4><div class="mover">
				<div class="row">centre at x <input type="number" step="0.5" data-mx value="${m.xMm}"> y <input type="number" step="0.5" data-my value="${m.yMm}"> mm</div>
				<div class="row"><span class="nudge"><span></span><button data-n="0,1" title="up 0.5 mm (shift: 2.5)">↑</button><span></span><button data-n="-1,0" title="left">←</button><button data-n="0,-1" title="down">↓</button><button data-n="1,0" title="right">→</button></span><span class="checking">${S.draft.busy ? "checking…" : "or drag it on the board"}</span></div>
				<div class="row">turned ${m.rotationDeg}° <button class="btn" data-turn="90" title="Turn 90° counter-clockwise: the capacitors on its pins turn with it">⟲ 90°</button><button class="btn" data-turn="270" title="Turn 90° clockwise">⟳ 90°</button></div>
				<div class="swapnote">From the board's bottom-left corner, top view. Each move is checked at once; nothing goes to the run until you send your moves.</div>
				${refused}</div>`
		const len = m.edges[m.edge]
		return `<h4>Move</h4><div class="mover">
			<div class="row edges">${["left", "top", "right", "bottom"].map((e) => `<button class="btn" data-edge="${e}" aria-pressed="${e === m.edge}">${e}</button>`).join("")}</div>
			<div class="row"><input type="range" data-off min="0" max="${len}" step="0.5" value="${m.offsetMm}"><input type="number" step="0.5" data-offn value="${m.offsetMm}"> mm</div>
			<div class="swapnote">Along the ${esc(m.edge)} edge (${len} mm), from its ${m.edge === "left" || m.edge === "right" ? "bottom" : "left"} end. ${S.draft.busy ? "checking…" : "Or drag it to any edge on the board."}</div>
			${refused}</div>`
	}
	$("card").addEventListener("change", (e) => {
		const ref = S.selected
		const m = ref && shownAt(ref)
		if (!m) return
		if (e.target.matches("[data-mx],[data-my]")) {
			const x = Number($("card").querySelector("[data-mx]").value), y = Number($("card").querySelector("[data-my]").value)
			if (Number.isFinite(x) && Number.isFinite(y)) propose(partMove(ref, x, y, m.rotationDeg))
		}
		if (e.target.matches("[data-off],[data-offn]")) {
			const v = Number(e.target.value)
			if (Number.isFinite(v)) propose({ ref, edge: m.edge, offsetMm: r1(v) })
		}
	})
	$("card").addEventListener("click", (e) => {
		const ref = S.selected
		const m = ref && shownAt(ref)
		if (!m) return
		const n = e.target.closest("button[data-n]")
		if (n && m.kind === "part") {
			const [dx, dy] = n.dataset.n.split(",").map(Number)
			const k = e.shiftKey ? 2.5 : 0.5
			propose(partMove(ref, m.xMm + dx * k, m.yMm + dy * k, m.rotationDeg))
		}
		const t = e.target.closest("button[data-turn]")
		if (t && m.kind === "part") propose(partMove(ref, m.xMm, m.yMm, (m.rotationDeg + Number(t.dataset.turn)) % 360))
		const ed = e.target.closest("button[data-edge]")
		if (ed && m.kind === "connector" && ed.dataset.edge !== m.edge) {
			const len = m.edges[ed.dataset.edge]
			propose({ ref, edge: ed.dataset.edge, offsetMm: r1(Math.min(m.offsetMm, len / 2) || len / 2) })
		}
	})

	function paintDraft() {
		const d = S.draft
		const box = $("draft")
		const undoBtn = S.lastSent && editable() && LIVE.has(S.view?.status) ? `<button class="btn" data-undo-sent title="Puts the opposite moves in a new draft, checked like any move; a part the layout had placed goes back to the layout's choice">Undo the moves you sent</button>` : ""
		// With no draft and no note, the undo of the last batch sent stays on offer (it went with the dismissed note before).
		if (!d.moves.length && !d.note && !undoBtn) {
			box.hidden = true
			return
		}
		box.hidden = false
		if (!d.moves.length) {
			box.innerHTML = d.note ? `<div class="swapnote">${esc(d.note)}</div><div class="acts"><button class="btn" data-dismiss>OK</button>${undoBtn}</div>` : `<div class="acts">${undoBtn}</div>`
			return
		}
		const c = d.check
		if (d.sent) {
			box.innerHTML = `<div class="h"><b>Sent</b><span>${d.moves.length} move${d.moves.length === 1 ? "" : "s"}</span></div><div class="pending" style="margin-top:8px">${esc(d.note)}</div><div class="swapnote"><code>${esc(c.request)}</code></div>`
			return
		}
		const live = LIVE.has(S.view?.status)
		box.innerHTML = `<div class="h"><b>Your moves</b><span>${d.moves.length} · checked in code · not sent</span></div>
			<ol>${c.moves.map((m) => `<li><span class="mv">${esc(m.ref)} ${esc(m.from)} → ${esc(m.to)}</span><span class="scope ${m.scope}" title="${m.scope === "system" ? "another board's cable plugs in here" : m.scope === "case" ? "the case follows it" : "only this board is re-routed"}">${m.scope}</span><ul>${m.effects.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></li>`).join("")}</ol>
			${c.alsoMoved.length ? `<div class="also">The layout also moves ${esc(c.alsoMoved.join(", "))} around them.</div>` : ""}
			<div class="also">Sent as one change request: the owners write it, and the run's checks and its review see the whole batch once. The routed board follows about 50 s after.</div>
			${live ? "" : `<div class="swapnote">This run has stopped, so it can't take the moves. Start a run and send this request:<code>${esc(c.request)}</code></div>`}
			<div class="acts"><button class="btn primary" data-send ${live && !d.busy ? "" : "disabled"}>Send ${d.moves.length} move${d.moves.length === 1 ? "" : "s"}</button><button class="btn" data-undo ${d.busy ? "disabled" : ""} title="Take back the last move in the list">Take back last</button><button class="btn" data-discard ${d.busy ? "disabled" : ""}>Discard</button></div>`
	}
	// Undo of the last batch sent: the server works out the opposite moves from the revision it was sent against, and
	// checks them on this one; they become a draft like any other, sent the same way.
	async function undoSent() {
		const last = S.lastSent
		if (!last || !editable()) return
		let res = null
		try {
			const r = await fetch(`/api/runs/${encodeURIComponent(run)}/board/check`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ rev: S.view.revision, undo: { rev: last.base, moves: last.moves } }) })
			res = await r.json()
			if (!r.ok) throw new Error(res.error ?? r.status)
		} catch (err) {
			endDraft(`Couldn't work out the undo (${err.message ?? err}).`)
			return redraw()
		}
		if (!res.ok) {
			endDraft(`The undo can't go in as it is: ${res.problems.map((p) => p.message).join(" ")}`)
			return redraw()
		}
		S.draft = { base: S.view.revision, moves: res.applied, check: res, refused: null, busy: false, sent: false, note: null }
		if (S.live) setLive(false)
		redraw(res.applied.map((m) => m.ref))
	}
	$("draft").addEventListener("click", async (e) => {
		const d = S.draft
		if (e.target.closest("[data-undo-sent]")) return undoSent()
		if (e.target.closest("[data-dismiss]")) { endDraft(null); return redraw() }
		if (e.target.closest("[data-discard]")) { endDraft(null); return redraw() }
		if (e.target.closest("[data-undo]")) {
			const rest = d.moves.slice(0, -1)
			if (!rest.length) { endDraft(null); return redraw() }
			S.draft.moves = rest.slice(0, -1)
			return propose(rest.at(-1))
		}
		const b = e.target.closest("[data-send]")
		if (!b || b.disabled) return
		b.disabled = true
		try {
			const res = await fetch(`/api/runs/${encodeURIComponent(run)}/requests`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ text: d.check.request }) })
			if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.status)
		} catch (err) {
			b.disabled = false
			b.textContent = `Couldn't send (${err.message ?? err}): try again`
			return
		}
		S.draft.sent = true
		S.lastSent = { base: d.base, moves: d.moves }
		S.draft.note = `The owners write them and the run's checks run; the board updates here when the new revision lands.`
		// Follow the run again, so the answer shows as soon as it lands (load ends the draft on the new revision).
		setLive(true)
		paintDraft()
	})

	function select(ref, zoom) {
		S.selected = ref
		pcb.highlight(ref)
		if (ref && zoom) pcb.zoomTo?.(ref)
		paintList()
		paintCard()
		if (S.view) history.replaceState(null, "", `/board?run=${encodeURIComponent(run)}${S.live ? "" : `&rev=${S.view.revision}`}${ref ? `&part=${encodeURIComponent(ref)}` : ""}`)
	}

	$("rows").addEventListener("click", (e) => {
		const b = e.target.closest("button[data-ref]")
		if (b) select(b.dataset.ref, true)
	})
	$("q").addEventListener("input", (e) => {
		S.filter = e.target.value.trim()
		paintList()
	})
	$("q").addEventListener("keydown", (e) => {
		if (e.key !== "Enter") return
		const first = $("rows").querySelector("button[data-ref]")
		if (first) select(first.dataset.ref, true)
	})
	const step = (d) => {
		const v = S.view
		if (!v) return
		const i = v.revisions.indexOf(v.revision) + d
		if (i < 0 || i >= v.revisions.length) return
		setLive(i === v.revisions.length - 1)
		load(v.revisions[i])
	}
	$("prev").addEventListener("click", () => step(-1))
	$("next").addEventListener("click", () => step(1))
	function setLive(on) {
		S.live = on
		$("live").setAttribute("aria-pressed", String(on))
	}
	$("live").addEventListener("click", () => {
		setLive(!S.live)
		if (S.live) load(null)
	})
	for (const b of document.querySelectorAll("[data-side]"))
		b.addEventListener("click", () => {
			for (const o of document.querySelectorAll("[data-side]")) o.setAttribute("aria-pressed", String(o === b))
			pcb.setView(b.dataset.side)
		})
	document.addEventListener("keydown", (e) => {
		if (e.target.closest("input")) return
		// Esc first drops a refused move (the card goes back to where the part is), then the selection.
		if (e.key === "Escape" && S.draft.refused) {
			S.draft.refused = null
			paintCard()
		} else if (e.key === "Escape") select(null, false)
		if (e.key === "/") { e.preventDefault(); $("q").focus() }
		if (e.key === "ArrowLeft") step(-1)
		if (e.key === "ArrowRight") step(1)
	})

	// Live: the run's own event stream. A new revision or a built board reloads the newest view (placement at once,
	// the routed board when its build lands); a page looking at an older revision stays where it is.
	if (run) {
		let timer = null
		const es = new EventSource(`/runs/${encodeURIComponent(run)}/events`)
		es.onmessage = (m) => {
			if (!S.live) return
			let e
			try { e = JSON.parse(m.data) } catch { return }
			if (!["contract.changed", "artifact.ready", "design.settled", "design.ready"].includes(e?.type)) return
			clearTimeout(timer)
			timer = setTimeout(() => load(null), 250)
		}
	}
	load(S.live ? null : S.revision)
</script>
</body>
</html>
