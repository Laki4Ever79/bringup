; The robot arm's firmware (docs/superpowers/specs/2026-11-25-robot-arm-design.md). `pio run` builds the board (the
; PCA9685 back end); <chip>_sim builds the same program with the UART back end for QEMU + MuJoCo (SIM.md).
; src/tools/firmware.ts prepareFirmware sets default_envs from the board's MCU.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3_sim]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
; DIO: Espressif's QEMU flash model can't enable QIO.
board_build.flash_mode = dio
build_flags = -DHW_SIM=1

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_sim]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
build_flags = -DHW_SIM=1
