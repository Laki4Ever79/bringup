; The rover firmware (docs/mechanics.md). `pio run` builds the board; esp32c3_sim builds the same program with the
; simulation hardware layer (src/hw_sim.cpp) for QEMU + MuJoCo; native runs the control logic's unit test on the host.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
lib_deps = pololu/VL53L0X@1.3.1
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_sim]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
; DIO: Espressif's QEMU flash model can't enable QIO.
board_build.flash_mode = dio
build_flags = -DHW_SIM=1

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<rover.cpp>
