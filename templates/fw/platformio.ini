; `pio run` with no -e builds only the design's chip. The bench builds its own env:
; pio run -e esp32s3_bench -t upload (py/bench.py, docs/design/bench.md).
; The platform (compiler + Arduino core) is pinned like the libraries: a fresh clone builds with the same toolchain.
[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
; DIO, not the board's default QIO: Espressif's QEMU flash model can't enable QIO, so a QIO image asserts in
; init_flash before setup() runs. DIO works on real hardware too, only slightly slower.
board_build.flash_mode = dio
; BLE for the product path (main.cpp serveBle); MQTT for its Wi-Fi path (serveWifi). Pinned: the template is compiled
; per design, so it must not move. The partition table follows connectivity.updates (prepareFirmware sets it).
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    knolleary/PubSubClient@2.8
; collect.cpp is the data-collection firmware's; without -DCOLLECT it compiles to nothing.

; Data-collection firmware (src/collect.cpp): the model's sensor, streamed over USB, stamped with the sensor path.
; Built when the contract has a model: pio run -e esp32c3_collect
[env:esp32c3_collect]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
build_src_filter = +<*> -<main.cpp>
; Serial on the C3's native USB (Serial/JTAG, GPIO18/19), which is the only port a Bringup board wires out. Without
; these, Arduino's Serial is UART0 (GPIO20/21), which the board leaves unconnected.
build_flags =
    -DCOLLECT=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Model check on the target (src/infer.cpp): the converted model (model_data.cc) run once by TensorFlow Lite Micro,
; which reports the arena it used. Built by `bringup verify-model --device` and run in QEMU (Serial = UART0, which
; QEMU reads). Pinned like the rest: ESP_TF is Espressif's TFLite Micro with ESP-NN kernels, as a library.
[env:esp32c3_infer]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
build_src_filter = +<*> -<main.cpp>
build_flags = -DINFER=1
lib_deps = nickjgniklu/ESP_TF@2.1.1

; Factory-test firmware (src/factory_test.cpp, include/testkit.h): the self-tests the design's parts call for, reported
; on the native USB for the test station. Built by the test-kit builder when the contract has a test field.
[env:esp32c3_test]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
build_src_filter = +<*> -<main.cpp>
build_flags =
    -DFACTORY_TEST=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Link-test firmware (docs/system.md): the product firmware with -DLINK_TEST, which sends a known reading over each link
; every half second, prints what arrives, then stops. Two boards (or two QEMUs) running it check the link end to end.
; Built by the system's link test: pio run -e esp32c3_linktest
[env:esp32c3_linktest]
platform = espressif32@8.0.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
lib_deps =
    h2zero/NimBLE-Arduino@2.5.2
    knolleary/PubSubClient@2.8
build_flags = -DLINK_TEST=1

; The YD-ESP32-S3 N16R8 on the desk (flags from hw_agent firmware/blink_pwm). Flashed over the native USB port.
; Telemetry leaves on that same USB port (Serial = USB CDC) and on UART1 TX (GPIO17) for a CP2102, if one is wired.
[env:esp32s3_bench]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -DBENCH=1
    -DBENCH_PERIOD_S=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
