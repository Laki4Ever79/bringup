# The free tier on a fresh machine of each OS: npm ci, typecheck, the MCP server's handshake, a mock design with no
# tools, then each setup domain (board, case, firmware, sim) and a design that needs it, a rover's MuJoCo drive among
# them; `bringup-mcp login` against a fake Studio on localhost, with the last design streaming to it
# (scripts/ci-smoke.mjs). Each step's time and pass/fail are in the job summary; the packed job takes the newcomer's
# path through the npm tarball a user installs. On demand and on pushes to main, not on every commit.
name: OS smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # npm's download cache for the repo and the board tools' lockfile (a fresh Windows runner took 135 s for
          # setup board's 371 packages, Linux 9 s): a CI speed-up only; a user's first install is what it is.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/setup/tools-node/package-lock.json
      # Espressif's macOS QEMU links Homebrew's libraries (README: setup sim); Linux's libslirp comes with setup sim and
      # Windows' build carries its DLLs.
      - name: QEMU's libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libgcrypt glib pixman sdl2 libslirp
      - name: Smoke test (each step timed in the job summary)
        run: node scripts/ci-smoke.mjs

  # What a user installs, not the checkout: `npm pack`, the .tgz installed into an empty folder, every setup domain
  # from that copy, then the firmware design and the newcomer's MCP path through `npx bringup-mcp`. No npm ci here,
  # so the package can't lean on the repo's own node_modules.
  packed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/setup/tools-node/package-lock.json
      - name: The packed package through npx (each step timed in the job summary)
        run: node scripts/ci-smoke.mjs --packed

  # Is Windows' slow setup Defender's real-time scan? The same two installs with the scan excluded from the folders
  # they write, timed beside the main job's (run 4: setup board 197 s, setup case 70 s; Linux 10 s and 8 s).
  windows-defender-excluded:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/setup/tools-node/package-lock.json
      - name: Exclude the folders the installs write from Defender's scan
        shell: pwsh
        run: Add-MpPreference -ExclusionPath $env:TEMP, $env:RUNNER_TEMP, "$env:LOCALAPPDATA\npm-cache", $env:GITHUB_WORKSPACE
      - run: npm ci --no-audit --no-fund
      - name: setup board and setup case, timed
        shell: pwsh
        env:
          BRINGUP_HOME: ${{ runner.temp }}\bringup-home
        run: |
          $b = Measure-Command { node bin/bringup-mcp.js setup board | Out-Host }
          $c = Measure-Command { node bin/bringup-mcp.js setup case | Out-Host }
          $md = "### Windows, Defender's scan excluded`n`n| Step | Time |`n|---|---|`n| setup board | $([math]::Round($b.TotalSeconds, 1)) s |`n| setup case | $([math]::Round($c.TotalSeconds, 1)) s |`n"
          $md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $md
