# The free tier on a fresh machine of each OS: npm ci, typecheck, the MCP server's handshake, a mock design with no
# tools, then `setup board` and a mock design with the board and its pictures (scripts/ci-smoke.mjs). Each step's time
# and pass/fail are in the job summary. On demand and on pushes to main, not on every commit.
name: OS smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Smoke test (each step timed in the job summary)
        run: node scripts/ci-smoke.mjs
